comfyui:
  host: "http://127.0.0.1:8188"
  workflow_json: "workflows/optimized_flux2_klein_512_v02.json"

models:
  checkpoint: "flux-2-klein-4b.safetensors"
  vae: "full_encoder_small_decoder.safetensors"
  clip: "qwen_3_4b.safetensors"

whisper:
  model: "base"          # tiny | base | small | medium | large-v2
  device: "auto"         # cpu | cuda | auto
  compute_type: "int8"   # int8 | float16

audio:
  sample_rate: 16000
  chunk_duration_ms: 500   # mic read chunk size in ms
  channels: 1
  buffer_seconds: 3        # legacy/unused, kept for back-compat with old configs
  transcribe_interval: 1.5 # legacy/unused, kept for back-compat with old configs
  silence_threshold: 0.01  # RMS below this = silence, per-chunk (set 0.0 to disable)
  min_silence_ms: 600      # pause length (ms) that ends an utterance and triggers transcription
  min_speech_ms: 150       # speech length (ms) required to confirm an utterance has started
  max_utterance_ms: 8000   # force-flush long monologues so the prompt still updates

webcam:
  device_index: 0   # 0 = default camera; try 1, 2... if wrong camera opens
  width: 512
  height: 512

display:
  window_size: 960   # preview window size in pixels (square) -- drag corner to resize freely
  interpolate: true   # OpenCV optical-flow midframe shown between real outputs, smooths perceived fps

feedback:
  enabled: true    # blend each new frame's latent with the previous output's latent (node 154)
  strength: 0.7    # starting blend_factor on launch -- weight on the LIVE webcam frame.
                    # 1.0 = pure live frame, no memory. 0.0 = ignore the live frame entirely
                    # (max ghosting / self-looping on the previous output). Tune live in the
                    # preview window with [ (more ghosting) / ] (more live) / 0 / 1 shortcuts
                    # once start.bat is running.
  step: 0.02       # how much each [ / ] keypress changes the strength

prompting:
  # {phrase} is replaced with whatever Whisper transcribes. Customize this to bias every
  # prompt toward FLUX.2 Klein's editing-specific style (see PROMPTS.md) without having to
  # say it out loud every time.
  template: "{phrase}"

nodes:
  # Match the node IDs from your exported ComfyUI workflow API JSON
  prompt_node_id: "139"     # CLIPTextEncode (positive prompt)
  seed_node_id: "136"       # RandomNoise
  feedback_node_id: "154"   # LatentBlend (temporal feedback)
  # NOTE: FLUX2 workflow uses ReferenceLatent — there is no denoise parameter
